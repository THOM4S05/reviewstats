services:
  app:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: sqlite:////data/review_attribution.db
      PUBLIC_BASE_URL: http://localhost:8000
      REVIEW_DESTINATION: mock
    volumes:
      - review_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 15s
volumes:
  review_data:
